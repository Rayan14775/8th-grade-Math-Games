<!DOCTYPE html>
<html>
<head>
    <title>My 8th grade Math Games</title>
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; padding: 50px; }
        h1 { color: #4CAF50; font-size: 3rem; margin-bottom: 10px; }
        .subtitle { color: #888; font-size: 1.2rem; margin-bottom: 40px; }
        .menu-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .game-card { background-color: #2a2a2a; border: 2px solid #444; border-radius: 10px; padding: 20px; width: 200px; text-align: center; text-decoration: none; color: #fff; transition: 0.2s; display: block; }
        .game-card:hover { transform: translateY(-5px); border-color: #4CAF50; background-color: #333; }
        .game-icon { font-size: 3rem; margin-bottom: 10px; display: block; }
        .game-title { font-weight: bold; font-size: 1.3rem; }
    </style>
</head>
<body>

    <h1>🎮 Unblocked Arcade</h1>
    <p class="subtitle">Welcome to your personal game hub. Select a game below to play instantly!</p>

    <div class="menu-container">
        <!-- Links to separate Snake Folder -->
        <a href="snake/" class="game-card">
            <span class="game-icon">🐍</span>
            <span class="game-title">Classic Snake</span>
        </a>

        <!-- Links to separate Minecraft Folder -->
        <a href="minecraft/" class="game-card">
            <span class="game-icon">⛏️</span>
            <span class="game-title">WebCraft 3D</span>
        </a>
    </div>

</body>
</html>
