<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D WebCraft (Minecraft Clone)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #1a1a1a; font-family: sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 20px; pointer-events: none; user-select: none; }
        #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px; color: white; font-size: 14px; text-align: center; pointer-events: none; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #4CAF50; font-size: 24px; font-weight: bold; }
    </style>
    <!-- Three.js Library for 3D Graphics -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="loading">Generating World... Dev Mode</div>
    <div id="crosshair">+</div>
    <div id="ui">
        <b>Controls:</b> Click screen to lock mouse | WASD = Move | Space = Jump | Left Click = Break | Right Click = Place
    </div>

    <script>
        // Setup Scene, Camera, Render
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee); // Sky blue
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // Block Physics/Definition
        const blockSize = 1;
        const grid = {};
        const blockGeo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
        
        // Colors for block types
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x557a2b }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x866043 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x808080 })
        };

        function addBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(blockGeo, materials[type]);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            grid[`${x},${y},${z}`] = mesh;
        }

        // Generate flat dirt/grass world
        const worldSize = 20;
        for (let x = -worldSize; x < worldSize; x++) {
            for (let z = -worldSize; z < worldSize; z++) {
                addBlock(x, 0, z, 'grass');
                addBlock(x, -1, z, 'dirt');
                addBlock(x, -2, z, 'stone');
            }
        }
        document.getElementById('loading').style.display = 'none';

        // Player configuration
        camera.position.set(0, 2, 5);
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, moveUp = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // Pointer Lock (Click to capture mouse)
        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= e.movementX * 0.0025;
                camera.rotation.x -= e.movementY * 0.0025;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        });

        // Key Listeners
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
            if(e.code === 'Space') moveUp = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
            if(e.code === 'Space') moveUp = false;
        });

        // Raycasting for Digging & Building
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Center screen crosshair

        document.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);
            
            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                if (e.button === 0) { // Left Click: Destroy Block
                    if (intersect.object !== ambientLight && intersect.object !== directionalLight) {
                        scene.remove(intersect.object);
                        const p = intersect.object.position;
                        delete grid[`${p.x},${p.y},${p.z}`];
                    }
                } 
                else if (e.button === 2) { // Right Click: Place Block
                    const normal = intersect.face.normal;
                    const p = intersect.object.position;
                    // Calculate adjacent position relative to the clicked surface block face
                    const newX = Math.round(p.x + normal.x);
                    const newY = Math.round(p.y + normal.y);
                    const newZ = Math.round(p.z + normal.z);
                    addBlock(newX, newY, newZ, 'dirt');
                }
            }
        });
        // Disable regular right click menu inside game
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Game Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (document.pointerLockElement === document.body) {
                const delta = clock.getDelta();
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= velocity.y * 10.0 * delta; // Basic flight simulation

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.y = Number(moveUp) - Number(false);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;
                if (moveUp) velocity.y += direction.y * 40.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y += velocity.y * delta;
                
                // Ground safety net floor boundary
                if(camera.position.y < 1.5) camera.position.y = 1.5;
            }
            renderer.render(scene, camera);
        }
        animate();

        // Handle Screen Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            <div class="menu-container">
    <!-- Snake Game Button -->
    <a href="snake/" class="game-card">
        <span class="game-icon">🐍</span>
        <span class="game-title">Classic Snake</span>
    </a>

    <!-- Minecraft Game Button -->
    <a href="minecraft/" class="game-card">
        <span class="game-icon">⛏️</span>
        <span class="game-title">WebCraft 3D</span>
    </a>
</div>

            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
