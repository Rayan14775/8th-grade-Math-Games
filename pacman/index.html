<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Pac-Man (School Edition)</title>
    <style>
        body {
            background-color: #111;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #FFD700;
            margin: 5px 0;
        }
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        canvas {
            border: 4px solid #0000FF;
            background-color: #000;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 15px rgba(0, 0, 255, 0.4);
        }
        #score-board {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #FFD700;
        }
        #high-score {
            color: #fff;
            margin-left: 20px;
        }
    </style>
</head>
<body>

<a href="../" class="back-btn">⬅ Back to Menu</a>
<h1>Pac-Man Retro</h1>
<div id="score-board">
    Score: <span id="score">0</span>
    <span id="high-score">High Score: <span id="highScoreText">0</span></span>
</div>
<p style="color: #aaa; margin: 5px 0; font-size: 14px;">Eat the BIG flashing dots to turn ghosts blue and eat them!</p>
<canvas id="gameCanvas" width="380" height="380"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const tileSize = 20;
let score = 0;
let highScore = localStorage.getItem("pacman_highscore") || 0;
document.getElementById("highScoreText").innerText = highScore;

let frightenedTimer = 0;

// 3 = Power Pellet
const stringMap = [
    "1111111111111111111",
    "1300000001000000031",
    "1011011101011101101",
    "1011011101011101101",
    "1000000000000000001",
    "1011010111110101101",
    "1000010001000100001",
    "1111011101011101111",
    "2221012222222101222",
    "1111012112112101111",
    "2222022122212202222",
    "1111012111112101111",
    "2221012222222101222",
    "1111010111110101111",
    "1000000001000000001",
    "1011011101011101101",
    "1301000002000001031",
    "1101010111110101011",
    "1000010001000100001",
    "1111111111111111111"
];

const map = [];
for (let r = 0; r < stringMap.length; r++) {
    map.push(stringMap[r].split("").map(Number));
}

const pacman = { x: 9, y: 16, dx: 0, dy: 0, nextDx: 0, nextDy: 0 };

const ghosts = [
    { name: "Blinky", x: 9, y: 7, dx: 1, dy: 0, color: "#FF0000", startX: 9, startY: 7, type: "chase" },
    { name: "Pinky",  x: 8, y: 9, dx: -1, dy: 0, color: "#FFB8FF", startX: 8, startY: 9, type: "ambush" },
    { name: "Inky",   x: 9, y: 9, dx: 0, dy: -1, color: "#00FFFF", startX: 9, startY: 9, type: "random" },
    { name: "Clyde",  x: 10, y: 9, dx: 1, dy: 0, color: "#FFB852", startX: 10, startY: 9, type: "shy" }
];

window.addEventListener("keydown", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") { pacman.nextDx = -1; pacman.nextDy = 0; }
    if (e.code === "ArrowRight" || e.code === "KeyD") { pacman.nextDx = 1; pacman.nextDy = 0; }
    if (e.code === "ArrowUp" || e.code === "KeyW") { pacman.nextDx = 0; pacman.nextDy = -1; }
    if (e.code === "ArrowDown" || e.code === "KeyS") { pacman.nextDx = 0; pacman.nextDy = 1; }
});

function checkWall(x, y) {
    if (x < 0 || x >= map.length || y < 0 || y >= map.length) return true;
    return map[y][x] === 1;
}

function resetGame() {
    if (score > highScore) {
        highScore = score;
        localStorage.setItem("pacman_highscore", highScore);
        document.getElementById("highScoreText").innerText = highScore;
    }
    score = 0;
    document.getElementById("score").innerText = score;
    pacman.x = 9; pacman.y = 16; pacman.dx = 0; pacman.dy = 0; pacman.nextDx = 0; pacman.nextDy = 0;
    frightenedTimer = 0;
    ghosts.forEach(g => { g.x = g.startX; g.y = g.startY; });
    for(let r=0; r<map.length; r++) {
        for(let c=0; c<map[r].length; c++) {
            if (stringMap[r][c] === "0") map[r][c] = 0;
            if (stringMap[r][c] === "3") map[r][c] = 3;
        }
    }
}

let frameCount = 0;
function gameLoop() {
    requestAnimationFrame(gameLoop);
    if (++frameCount < 11) return;
    frameCount = 0;

    if (frightenedTimer > 0) frightenedTimer--;

    if (!checkWall(pacman.x + pacman.nextDx, pacman.y + pacman.nextDy)) {
        pacman.dx = pacman.nextDx; pacman.dy = pacman.nextDy;
    }
    if (!checkWall(pacman.x + pacman.dx, pacman.y + pacman.dy)) {
        pacman.x += pacman.dx; pacman.y += pacman.dy;
    }

    if (pacman.x < 0) pacman.x = map.length - 1;
    if (pacman.x >= map.length) pacman.x = 0;

    // Regular dots
    if (map[pacman.y][pacman.x] === 0) {
        map[pacman.y][pacman.x] = 2;
        score += 10;
        document.getElementById("score").innerText = score;
    }
    
    // Power Pellets
    if (map[pacman.y][pacman.x] === 3) {
        map[pacman.y][pacman.x] = 2;
        score += 50;
        frightenedTimer = 40; // Roughly 7 seconds at this speed loop
        document.getElementById("score").innerText = score;
    }

    ghosts.forEach(ghost => {
        let possibleMoves = [];
        const directions = [{x:1, y:0}, {x:-1, y:0}, {x:0, y:1}, {x:0, y:-1}];
        
        directions.forEach(d => {
            if (!checkWall(ghost.x + d.x, ghost.y + d.y) && !(d.x === -ghost.dx && d.y === -ghost.dy)) {
                possibleMoves.push(d);
            }
        });

        if (possibleMoves.length > 0) {
            let chosenMove = possibleMoves[0];

            if (frightenedTimer > 0) {
                // Run away randomly
                chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            } else if (ghost.type === "chase" || (ghost.type === "shy" && Math.abs(ghost.x - pacman.x) + Math.abs(ghost.y - pacman.y) > 4)) {
                let minDist = Infinity;
                possibleMoves.forEach(m => {
                    let d = Math.pow((ghost.x + m.x) - pacman.x, 2) + Math.pow((ghost.y + m.y) - pacman.y, 2);
                    if (d < minDist) { minDist = d; chosenMove = m; }
                });
            } else if (ghost.type === "ambush") {
                let tx = pacman.x + pacman.dx * 2;
                let ty = pacman.y + pacman.dy * 2;
                let minDist = Infinity;
                possibleMoves.forEach(m => {
                    let d = Math.pow((ghost.x + m.x) - tx, 2) + Math.pow((ghost.y + m.y) - ty, 2);
                    if (d < minDist) { minDist = d; chosenMove = m; }
                });
            } else {
                if (Math.random() < 0.2 || checkWall(ghost.x + ghost.dx, ghost.y + ghost.dy)) {
                    chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                } else {
                    chosenMove = {x: ghost.dx, y: ghost.dy};
                }
            }
            ghost.dx = chosenMove.x; ghost.dy = chosenMove.y;
        }

        if (!checkWall(ghost.x + ghost.dx, ghost.y + ghost.dy)) {
            ghost.x += ghost.dx; ghost.y += ghost.dy;
        }

        // Collision logic
        if (pacman.x === ghost.x && pacman.y === ghost.y) {
            if (frightenedTimer > 0) {
                // Eat ghost
                score += 200;
                document.getElementById("score").innerText = score;
                ghost.x = ghost.startX;
                ghost.y = ghost.startY;
            } else {
                alert("Game Over! Final Score: " + score);
                resetGame();
            }
        }
    });

    // Draw
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < map.length; r++) {
        for (let c = 0; c < map[r].length; c++) {
            if (map[r][c] === 1) {
                ctx.fillStyle = "#0000FF";
                ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
            } else if (map[r][c] === 0) {
                ctx.fillStyle = "#FFD700";
                ctx.beginPath(); ctx.arc(c * tileSize + tileSize/2, r * tileSize + tileSize/2, 3, 0, Math.PI * 2); ctx.fill();
            } else if (map[r][c] === 3) {
                // Flash Power Pellets
                if (Math.floor(Date.now() / 200) % 2 === 0) {
                    ctx.fillStyle = "#FFB852";
                    ctx.beginPath(); ctx.arc(c * tileSize + tileSize/2, r * tileSize + tileSize/2, 7, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
    }

    // Pacman
    ctx.fillStyle = "#FFFF00";
    ctx.beginPath();
    ctx.arc(pacman.x * tileSize + tileSize/2, pacman.y * tileSize + tileSize/2, tileSize/2 - 1, 0.2 * Math.PI, 1.8 * Math.PI);
    ctx.lineTo(pacman.x * tileSize + tileSize/2, pacman.y * tileSize + tileSize/2);
    ctx.fill();

    // Ghosts
    ghosts.forEach(ghost => {
        ctx.fillStyle = frightenedTimer > 0 ? (frightenedTimer < 12 && Math.floor(Date.now() / 150) % 2 === 0 ? "#fff" : "#0000FF") : ghost.color;
        ctx.beginPath();
        ctx.arc(ghost.x * tileSize + tileSize/2, ghost.y * tileSize + tileSize/2, tileSize/2 - 1, Math.PI, 0, false);
        ctx.lineTo(ghost.x * tileSize + tileSize, ghost.y * tileSize + tileSize);
        ctx.lineTo(ghost.x * tileSize, ghost.y * tileSize + tileSize);
        ctx.fill();
    });
}
gameLoop();
</script>
</body>
</html>
